x-app-volumes: &app-volumes
  - .:/var/www/html
  - ../crawlerx:/var/www/crawlerx
  - ../client:/var/www/client:ro
  - ../dto:/var/www/dto:ro
  - ../exceptions:/var/www/exceptions:ro
  - ../laravel-controller:/var/www/laravel-controller:ro
  - ../laravel-repository:/var/www/laravel-repository:ro
  - playwright-browsers:/ms-playwright

x-app-environment: &app-environment
  DB_HOST: postgres
  MONGO_HOST: mongo
  ELASTICSEARCH_HOST: http://elasticsearch:9200
  CRAWLERX_ROOT: /var/www/crawlerx
  CRAWLERX_NODE: node
  CRAWLERX_PLAYWRIGHT_SCRIPT: /var/www/crawlerx/scripts/playwright-fetch.mjs
  CRAWLERX_PUPPETEER_SCRIPT: /var/www/crawlerx/scripts/puppeteer-stealth-fetch.mjs
  CRAWLERX_FLARESOLVERR_URL: http://flaresolverr:8191/v1
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  JVMETA_FETCH_PROFILE: browser_likely
  JVMETA_WORKERS_PER_QUEUE: "1"
  JVMETA_QUEUE_NAMES: listing,detail,performer_listing,performer_detail,gallery
  OPENOBSERVE_URL: http://openobserve:5080
  OPENOBSERVE_ORG: default
  OPENOBSERVE_STREAM_LOGS: jvmeta_logs
  OPENOBSERVE_STREAM_METRICS: jvmeta_metrics

x-worker: &worker
  image: jooservices/jvmeta:php85
  working_dir: /var/www/html
  entrypoint: ["crawlerx-fetch-ready"]
  command: ["worker-queues"]
  env_file:
    - .env
  environment:
    <<: *app-environment
  volumes: *app-volumes
  depends_on:
    postgres:
      condition: service_healthy
    mongo:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    flaresolverr:
      condition: service_started
    openobserve:
      condition: service_started
  restart: unless-stopped

services:
  api:
    build:
      context: .
    image: jooservices/jvmeta:php85
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8080
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
      - ../crawlerx:/var/www/crawlerx:ro
      - ../client:/var/www/client:ro
      - ../dto:/var/www/dto:ro
      - ../exceptions:/var/www/exceptions:ro
      - ../laravel-controller:/var/www/laravel-controller:ro
      - ../laravel-repository:/var/www/laravel-repository:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      openobserve:
        condition: service_started

  # Instance 1 — 5 queues × 1 worker
  worker:
    <<: *worker
    hostname: jvmeta-worker-1

  # Instance 2 — same queue set (shared pool)
  worker-2:
    <<: *worker
    hostname: jvmeta-worker-2

  scheduler:
    image: jooservices/jvmeta:php85
    working_dir: /var/www/html
    command: php artisan schedule:work
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
      - ../crawlerx:/var/www/crawlerx:ro
      - ../client:/var/www/client:ro
      - ../dto:/var/www/dto:ro
      - ../exceptions:/var/www/exceptions:ro
      - ../laravel-controller:/var/www/laravel-controller:ro
      - ../laravel-repository:/var/www/laravel-repository:ro
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      openobserve:
        condition: service_started

  mcp:
    image: jooservices/jvmeta:php85
    working_dir: /var/www/html
    command: php artisan mcp:serve
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes:
      - .:/var/www/html
      - ../crawlerx:/var/www/crawlerx:ro
      - ../client:/var/www/client:ro
      - ../dto:/var/www/dto:ro
      - ../exceptions:/var/www/exceptions:ro
      - ../laravel-controller:/var/www/laravel-controller:ro
      - ../laravel-repository:/var/www/laravel-repository:ro
    stdin_open: true
    tty: true
    profiles:
      - mcp
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jvmeta
      POSTGRES_USER: jvmeta
      POSTGRES_PASSWORD: jvmeta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jvmeta -d jvmeta"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo/db:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    ports:
      - "9200:9200"
    volumes:
      - ./data/elasticsearch/data:/usr/share/elasticsearch/data

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.1
    environment:
      LOG_LEVEL: info
      HEADLESS: "true"
    ports:
      - "8191:8191"
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:v0.92.0
    environment:
      ZO_DATA_DIR: /data
      ZO_LOCAL_MODE: "true"
      ZO_TELEMETRY: "false"
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@jvmeta.local}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
    ports:
      - "5080:5080"
    volumes:
      - ./data/openobserve:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5080/healthz >/dev/null 2>&1 || curl -fsS http://127.0.0.1:5080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  playwright-browsers:
